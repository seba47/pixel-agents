<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixel Agents — Archipelago</title>
    <!-- Dev-only mock-up (npm run dev → /archipelago/). Not part of the build. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --glass: rgba(14, 16, 32, 0.52);
        --glass-strong: rgba(14, 16, 32, 0.72);
        --line: rgba(255, 255, 255, 0.12);
        --text: #f4f5fb;
        --muted: rgba(235, 238, 255, 0.62);
        --work: #4fd1ff;
        --need: #ffb020;
        --done: #6fe08a;
        --idle: #a4acd0;
        --shadow: 0 14px 40px rgba(5, 6, 20, 0.28);
      }
      body.light {
        --glass: rgba(255, 255, 255, 0.55);
        --glass-strong: rgba(255, 255, 255, 0.78);
        --line: rgba(20, 40, 80, 0.12);
        --text: #12203a;
        --muted: rgba(18, 32, 58, 0.6);
        --shadow: 0 14px 40px rgba(20, 60, 110, 0.16);
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d1a;
        color: var(--text);
        font-family: Inter, system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      #scene canvas {
        display: block;
      }
      .glass {
        background: var(--glass);
        backdrop-filter: blur(18px) saturate(150%);
        -webkit-backdrop-filter: blur(18px) saturate(150%);
        border: 1px solid var(--line);
        border-radius: 16px;
        box-shadow: var(--shadow);
      }

      /* Top bar */
      #top {
        position: fixed;
        top: 18px;
        left: 20px;
        right: 20px;
        display: grid;
        grid-template-columns: 1fr auto 1fr;
        align-items: center;
        pointer-events: none;
      }
      #top > * {
        pointer-events: auto;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-family: 'Space Grotesk', Inter, sans-serif;
        font-weight: 700;
        font-size: 19px;
        letter-spacing: -0.01em;
        text-shadow: 0 1px 12px rgba(0, 0, 0, 0.25);
        justify-self: start;
      }
      .brand small {
        display: block;
        font-family: Inter, sans-serif;
        font-weight: 500;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .mark {
        width: 34px;
        height: 34px;
        border-radius: 11px;
        background: linear-gradient(135deg, #ff6fae, #ffb020 55%, #4fd1ff);
        display: grid;
        place-items: center;
        box-shadow: 0 6px 18px rgba(255, 111, 174, 0.35);
      }
      #switch {
        display: flex;
        padding: 4px;
        gap: 2px;
        border-radius: 999px;
      }
      #switch button {
        font: 600 13px Inter, sans-serif;
        color: var(--muted);
        background: none;
        border: 0;
        padding: 8px 16px;
        border-radius: 999px;
        cursor: pointer;
        transition: background 0.2s, color 0.2s;
      }
      #switch button:hover {
        color: var(--text);
      }
      #switch button.on {
        background: var(--text);
        color: #12142a;
      }
      body.light #switch button.on {
        color: #fff;
      }
      .summary {
        justify-self: end;
        display: flex;
        gap: 8px;
      }
      .chip {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 8px 12px;
        border-radius: 999px;
        font: 600 12.5px Inter, sans-serif;
      }
      .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        flex-shrink: 0;
      }
      .chip.need {
        background: rgba(255, 176, 32, 0.92);
        color: #2a1a00;
        border-color: transparent;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 6px rgba(255, 176, 32, 0.18), var(--shadow);
        }
      }

      /* Info card */
      #info {
        position: fixed;
        top: 82px;
        left: 20px;
        width: 330px;
        padding: 18px 20px;
        font-size: 13.5px;
        line-height: 1.5;
        transition: opacity 0.3s;
      }
      #info .eyebrow {
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #info h2 {
        font-family: 'Space Grotesk', Inter, sans-serif;
        font-size: 22px;
        margin: 4px 0 6px;
        letter-spacing: -0.01em;
      }
      #info .tagline {
        margin: 0 0 10px;
        color: var(--text);
        opacity: 0.9;
      }
      #info ul {
        margin: 0;
        padding-left: 18px;
        color: var(--muted);
      }
      #info li {
        margin: 4px 0;
      }
      #info li b {
        color: var(--text);
        font-weight: 600;
      }
      #info .why {
        margin: 10px 0 0;
        padding-top: 10px;
        border-top: 1px solid var(--line);
        color: var(--text);
        font-weight: 500;
      }
      #info .collapse {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      #info.min ul,
      #info.min .why,
      #info.min .tagline {
        display: none;
      }

      /* Needs you */
      #needs {
        position: fixed;
        top: 82px;
        right: 20px;
        width: 300px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .need-card {
        padding: 14px;
        border-left: 3px solid var(--need);
        animation: slide 0.35s cubic-bezier(0.2, 0.8, 0.2, 1);
      }
      @keyframes slide {
        from {
          opacity: 0;
          transform: translateX(20px);
        }
      }
      .need-card .who {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 600;
        font-size: 13.5px;
      }
      .need-card .who small {
        display: block;
        font-weight: 500;
        color: var(--muted);
        font-size: 12px;
      }
      .need-card .what {
        margin: 10px 0 12px;
        font-size: 13.5px;
      }
      .need-card .what code {
        font: 500 12.5px 'SF Mono', ui-monospace, monospace;
        background: rgba(255, 176, 32, 0.15);
        padding: 2px 6px;
        border-radius: 6px;
      }
      .actions {
        display: flex;
        gap: 8px;
      }
      .btn {
        flex: 1;
        font: 600 12.5px Inter, sans-serif;
        padding: 9px 10px;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid var(--line);
        background: none;
        color: var(--text);
      }
      .btn.primary {
        background: var(--need);
        border-color: transparent;
        color: #2a1a00;
      }
      .btn:hover {
        filter: brightness(1.08);
      }

      /* Crew dock */
      #dock {
        position: fixed;
        bottom: 18px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        padding: 10px;
        max-width: calc(100vw - 40px);
        overflow-x: auto;
      }
      .crew {
        width: 190px;
        padding: 10px 12px;
        border-radius: 12px;
        cursor: pointer;
        transition: background 0.2s, transform 0.2s;
        border: 1px solid transparent;
        flex-shrink: 0;
      }
      .crew:hover {
        background: rgba(255, 255, 255, 0.07);
        transform: translateY(-2px);
      }
      .crew.focus {
        border-color: var(--line);
        background: rgba(255, 255, 255, 0.09);
      }
      .crew .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .avatar {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        flex-shrink: 0;
        position: relative;
      }
      .avatar::after {
        content: '';
        width: 18px;
        height: 8px;
        border-radius: 6px;
        background: #121428;
        box-shadow: inset 0 0 0 2px rgba(191, 246, 255, 0.0);
        margin-top: -3px;
      }
      .avatar .st {
        position: absolute;
        right: -1px;
        bottom: -1px;
        width: 11px;
        height: 11px;
        border-radius: 50%;
        border: 2px solid rgba(14, 16, 32, 0.9);
      }
      .crew .name {
        font-weight: 600;
        font-size: 13.5px;
      }
      .crew .proj {
        font-size: 11.5px;
        color: var(--muted);
      }
      .crew .doing {
        margin-top: 8px;
        font-size: 12px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .bar {
        margin-top: 7px;
        height: 4px;
        border-radius: 4px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      body.light .bar {
        background: rgba(20, 40, 80, 0.1);
      }
      .bar i {
        display: block;
        height: 100%;
        border-radius: 4px;
      }

      /* In-world labels */
      #labels {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }
      .label {
        position: absolute;
        left: 0;
        top: 0;
        transform: translate(-50%, -100%) translateY(-6px);
        white-space: nowrap;
        will-change: transform;
      }
      .agent-tag {
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 5px 10px 5px 6px;
        border-radius: 999px;
        font: 600 12px Inter, sans-serif;
        background: var(--glass-strong);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18);
        color: var(--text);
      }
      .agent-tag .face {
        width: 18px;
        height: 18px;
        border-radius: 50%;
      }
      .agent-tag .act {
        font-weight: 500;
        color: var(--muted);
        max-width: 190px;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .agent-tag.need {
        background: rgba(255, 176, 32, 0.95);
        color: #2a1a00;
        border-color: transparent;
        animation: bob 1.2s ease-in-out infinite;
      }
      .agent-tag.need .act {
        color: #4a3000;
      }
      @keyframes bob {
        50% {
          transform: translate(-50%, -100%) translateY(-11px);
        }
      }
      .agent-tag::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: -5px;
        width: 8px;
        height: 8px;
        transform: translateX(-50%) rotate(45deg);
        background: inherit;
        border-right: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
      }
      .place {
        font-family: 'Space Grotesk', Inter, sans-serif;
        font-weight: 600;
        font-size: 15px;
        text-align: center;
        text-shadow: 0 2px 14px rgba(0, 0, 0, 0.45);
        color: #fff;
      }
      body.light .place {
        color: #12203a;
        text-shadow: 0 1px 10px rgba(255, 255, 255, 0.8);
      }
      .place small {
        display: block;
        font-family: Inter, sans-serif;
        font-weight: 600;
        font-size: 10.5px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        opacity: 0.75;
      }
      .place .rule {
        width: 1px;
        height: 18px;
        margin: 4px auto 0;
        background: currentColor;
        opacity: 0.5;
      }
      #hint {
        position: fixed;
        right: 20px;
        bottom: 22px;
        font-size: 11.5px;
        color: var(--muted);
      }
      #loading {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        font: 600 15px Inter, sans-serif;
        color: #9aa3c7;
        background: #0b0d1a;
        transition: opacity 0.6s;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="labels"></div>
    <div id="top">
      <div class="brand">
        <div class="mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 17c3-2 6-2 9 0s6 2 9 0" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
            <path d="M12 4v9M12 4l5 4h-5" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>
        <div>Pixel Agents<small>Archipelago · concept</small></div>
      </div>
      <div id="switch" class="glass"></div>
      <div class="summary" id="summary"></div>
    </div>
    <div id="info" class="glass"></div>
    <div id="needs"></div>
    <div id="dock" class="glass"></div>
    <div id="hint">Arrastrá para girar · rueda para acercar · clic en una tarjeta para seguir al agente</div>
    <div id="loading">Cargando el archipiélago…</div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
